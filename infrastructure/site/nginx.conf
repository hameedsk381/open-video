# The landing page's web server (the `site` image, see the Dockerfile). Static files only, on port 8080 as an unprivileged user.
# Note on add_header: nginx drops every server-level add_header inside a location that sets its own, so the locations below use `expires`
# (which sets Cache-Control without add_header) and the headers stay at the server level.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The page has two inline blocks (its style sheet and the copy button's script) and uses Google Fonts; everything else is its own files.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The clips and stills never change under the same name: cache them for a week. Video range requests are handled by nginx itself.
  location /media/ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    expires 5m;
    try_files $uri $uri/ =404;
  }
}
