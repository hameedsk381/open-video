# The hosted studio on one machine: `docker compose -f infrastructure/docker/compose.yml --env-file infrastructure/docker/.env up -d --build`
# (copy .env.example to .env and fill it in first). Put a TLS proxy (Caddy, nginx) in front of 127.0.0.1:3100 and set PUBLIC_ORIGIN to its https address.
#
# Networks:  `internal` has no route out. Postgres, Redis, the API and BOTH kinds of worker are on it.
#            `edge` reaches the internet. Only the API (to be published) and the AI worker (to call the AI provider) are on it.
#            So the render worker, which draws frames from people's compositions, can reach Redis and the shared data volume and nothing else.
# Every container: non-root, no Linux capabilities, no privilege gain, memory and process limits. Workers also have a read-only root filesystem.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
x-worker: &worker
  <<: *hardening
  build: { context: ../.., target: worker }
  image: ove-worker:local
  init: true
  read_only: true
  tmpfs: ["/tmp", "/home/node:mode=1777"]
  shm_size: 1gb
  pids_limit: 512
  volumes: ["data:/data"]
  depends_on: { redis: { condition: service_healthy } }

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: ove }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # the image starts as root, fixes folder owners, then drops to its own user
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d ove"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 10s, timeout: 5s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  api:
    <<: *hardening
    build: { context: ../.., target: api }
    image: ove-api:local
    init: true
    read_only: true
    tmpfs: ["/tmp", "/home/node:mode=1777"]
    pids_limit: 256
    mem_limit: 1g
    ports: ["127.0.0.1:${STUDIO_PORT:-3100}:3100"]
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ove"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, for example https://studio.example.com}"
      SETTINGS_SECRET: "${SETTINGS_SECRET:?set SETTINGS_SECRET, a long random string that protects the AI keys people save}"
      DATA_DIR: /data
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      SIGNUPS: "${SIGNUPS:-1}"
      REQUIRE_VERIFIED: "${REQUIRE_VERIFIED:-0}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    volumes: ["data:/data"]
    networks: [internal, edge]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  worker-render:
    <<: *worker
    environment:
      JOB_LANE: render
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      DATA_DIR: /data
      JOB_TIMEOUT_SECONDS: "${RENDER_TIMEOUT_SECONDS:-900}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    networks: [internal, edge]     # edge reaches S3/R2 object storage for direct CDN uploads
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-ai:
    <<: *worker
    environment:
      JOB_LANE: ai
      SETTINGS_SECRET: "${SETTINGS_SECRET:?set SETTINGS_SECRET, a long random string that protects the AI keys people save}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      DATA_DIR: /data
      JOB_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-300}"
      WORKER_CONCURRENCY: "${AI_CONCURRENCY:-1}"
      OVE_AI_TTS_PROVIDER: "${OVE_AI_TTS_PROVIDER:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    networks: [internal, edge]     # calls the AI provider
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    profiles: [s3]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
    volumes: ["s3data:/data"]
    networks: [internal, edge]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

networks:
  internal: { internal: true }
  edge: {}

volumes:
  data:
  pgdata:
  redisdata:
  s3data:
