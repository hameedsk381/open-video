# Dokploy deployment for the hosted OVE studio.
#
# In Dokploy: create a Compose project, point it at this repo, set the compose path to
# infrastructure/dokploy/compose.yml, and fill in the environment variables in the Environment tab.
#
# Dokploy's Traefik handles TLS and routing. In the Domains tab, set the app's subdomain for the `api` service (port 3100) and the main domain for the `site` service (port 8080).
# The same stack is at the repo root as docker-compose.yml (a test keeps the two in step).
# The render worker has no network route out — it can reach Redis and the shared data volume and nothing else.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-worker: &worker
  <<: *hardening
  build: { context: ../.. , dockerfile: Dockerfile, target: worker }
  init: true
  read_only: true
  tmpfs: ["/tmp", "/home/node:mode=1777"]
  shm_size: 1gb
  pids_limit: 512
  volumes: ["data:/data"]
  depends_on: { redis: { condition: service_healthy } }

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ove
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ove"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    networks: [internal]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    build: { context: ../.. , dockerfile: Dockerfile, target: api }
    init: true
    read_only: true
    tmpfs: ["/tmp", "/home/node:mode=1777"]
    pids_limit: 256
    mem_limit: 1g
    expose: ["3100"]
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ove"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}"
      SETTINGS_SECRET: "${SETTINGS_SECRET:?set SETTINGS_SECRET, a long random string that protects the AI keys people save}"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      SIGNUPS: "${SIGNUPS:-1}"
      REQUIRE_VERIFIED: "${REQUIRE_VERIFIED:-0}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    volumes: ["data:/data"]
    networks: [dokploy-network, internal]
    # Traefik (Dokploy) routes the app's host to the API on port 3100. APP_HOST is that host (default app.motionrender.io): it must also be PUBLIC_ORIGIN, as https://<APP_HOST>.
    # The main domain is the landing page, on the `site` service below. If you also add a host in Dokploy's Domains tab, remove that entry so two routers do not claim it.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.motionrender-api-web.rule=Host(`${APP_HOST:-app.motionrender.io}`)"
      - "traefik.http.routers.motionrender-api-web.entrypoints=web"
      - "traefik.http.routers.motionrender-api-web.service=motionrender-api-web"
      - "traefik.http.routers.motionrender-api-web.middlewares=redirect-to-https@file"
      - "traefik.http.services.motionrender-api-web.loadbalancer.server.port=3100"
      - "traefik.http.routers.motionrender-api-websecure.rule=Host(`${APP_HOST:-app.motionrender.io}`)"
      - "traefik.http.routers.motionrender-api-websecure.entrypoints=websecure"
      - "traefik.http.routers.motionrender-api-websecure.service=motionrender-api-websecure"
      - "traefik.http.routers.motionrender-api-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.motionrender-api-websecure.loadbalancer.server.port=3100"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The landing page, for the main domain (the app is on a subdomain, see docs/hosting.md). In Dokploy's Domains tab add the main domain for this
  # service on port 8080. It makes no calls to the API. The app's address is PUBLIC_ORIGIN, so the page's "Open the app" link needs no setting of its own.
  site:
    <<: *hardening
    build: { context: ../.. , dockerfile: Dockerfile, target: site, args: { APP_URL: "${PUBLIC_ORIGIN}" } }
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    pids_limit: 64
    mem_limit: 128m
    expose: ["8080"]
    networks: [dokploy-network]
    # The main domain (SITE_HOST, default motionrender.io) shows the landing page, which makes no calls to the API.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.motionrender-site-web.rule=Host(`${SITE_HOST:-motionrender.io}`)"
      - "traefik.http.routers.motionrender-site-web.entrypoints=web"
      - "traefik.http.routers.motionrender-site-web.service=motionrender-site-web"
      - "traefik.http.routers.motionrender-site-web.middlewares=redirect-to-https@file"
      - "traefik.http.services.motionrender-site-web.loadbalancer.server.port=8080"
      - "traefik.http.routers.motionrender-site-websecure.rule=Host(`${SITE_HOST:-motionrender.io}`)"
      - "traefik.http.routers.motionrender-site-websecure.entrypoints=websecure"
      - "traefik.http.routers.motionrender-site-websecure.service=motionrender-site-websecure"
      - "traefik.http.routers.motionrender-site-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.motionrender-site-websecure.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker-render:
    <<: *worker
    environment:
      JOB_LANE: render
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      DATA_DIR: /data
      JOB_TIMEOUT_SECONDS: "${RENDER_TIMEOUT_SECONDS:-900}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    networks: [dokploy-network, internal]
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-ai:
    <<: *worker
    environment:
      JOB_LANE: ai
      SETTINGS_SECRET: "${SETTINGS_SECRET:?set SETTINGS_SECRET, a long random string that protects the AI keys people save}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      DATA_DIR: /data
      JOB_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-300}"
      AI_CONCURRENCY: "${AI_CONCURRENCY:-1}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
    networks: [dokploy-network, internal]
    mem_limit: 2g
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
  internal:
    internal: true

volumes:
  data:
  pgdata:
  redisdata:
