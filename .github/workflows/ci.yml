name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from packageManager in package.json (the action refuses a second version here).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      # Installs exactly what pnpm-lock.yaml records, and fails if package.json and the lockfile disagree.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm ove doctor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

      - name: Build and smoke-test the npm package
        shell: bash
        run: |
          pnpm build:package
          mkdir -p "$RUNNER_TEMP/consumer" && cd packages/ove && npm pack --pack-destination "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer" && npm init -y >/dev/null && npm pkg set type=module
          npm install ./open-video-engine-*.tgz --no-audit --no-fund
          npx ove init demo --no-skill
          npx ove render demo/composition.json --output demo/out.mp4 --frames 0-29
          node -e "import('open-video-engine').then(m => { if (typeof m.renderMedia !== 'function') process.exit(1); console.log('API ok'); })"
