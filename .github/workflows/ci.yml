name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from packageManager in package.json (the action refuses a second version here).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      # Installs exactly what pnpm-lock.yaml records, and fails if package.json and the lockfile disagree.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:studio
      - run: pnpm --filter @ove/studio typecheck
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm ove doctor
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      # The catalogue is shared by every OS, so one runner reviews it; the check needs FFmpeg and a browser.
      - name: Check the template catalogue
        if: runner.os == 'Linux'
        run: pnpm check:templates

      - name: Build and smoke-test the npm package
        shell: bash
        run: |
          pnpm build:package
          mkdir -p "$RUNNER_TEMP/consumer" && cd packages/ove && npm pack --pack-destination "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer" && npm init -y >/dev/null && npm pkg set type=module
          npm install ./*.tgz --no-audit --no-fund
          npx ove init demo --no-skill
          npx ove render demo/composition.json --output demo/out.mp4 --frames 0-29
          node -e "import('motionrender').then(m => { if (typeof m.renderMedia !== 'function') process.exit(1); console.log('API ok'); })"

  # The images are what actually ships, so build them on every change: a failure that only shows up in the container build
  # (a typecheck of the packed tarball, a missing file) is caught here and not at deploy time. Nothing is pushed.
  docker:
    name: docker (api image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Known-vulnerability check on what ships. Advisory for now: it reports without failing the build, so a new advisory
  # in a transitive dependency does not block unrelated work. Tighten to a failing check once the baseline is clean.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm audit --prod --audit-level=high
